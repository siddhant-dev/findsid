<div class="form-container">
    <form >
        <fieldset>
            <legend class="header-4 bold">Lets Connect </legend>
            <p class="regular">
                Want to connect with me for any project or job oppurtunity? Fill in the form below I'll revert back to you
            </p>
            <div class="form-group">
                <label class="regular bold" for="name">Enter your Name</label>
                <input class="form-text" type="text" id="name" placeholder="Full Name">
            </div>
            <div class="form-group">
                <label class="regular bold" for="email">Enter your email</label>
                <input class="form-text" type="email" id="email" placeholder="someone@example.com">
            </div>
            <div class="form-group">
                <label class="regular bold" for="phone">Enter your Phone No.</label>
                <input class="form-text" type="tel" id="phone" placeholder="+919988776655">
            </div>
            <div class="form-group">
                <label class="regular bold" for="message">Enter your Message</label>
                <textarea class="form-text" type="tel" id="message"></textarea>
            </div>
            <button class="btn-text" type="submit">Send Message <i-feather name = "send"></i-feather></button>
        </fieldset>

        
    </form>
</div>
