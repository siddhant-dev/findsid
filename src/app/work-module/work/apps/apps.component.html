@if (!showSpinner) {
  <div class="grid-container" id="apps" aria-labelledby="tab-apps" tabindex="0">
    @for (data of apps; track data) {
      <app-card [card_data]=data></app-card>
    }
  </div>
}

@if (error) {
  <div class="error">{{error}}</div>
}

@if (showSpinner) {
  <app-loader></app-loader>
}
