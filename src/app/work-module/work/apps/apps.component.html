@if (!showSpinner) {
  @if (apps.length === 0 && !error) {
    <p class="empty-state">No projects are available right now.</p>
  }
  <div
    class="grid-container"
    [attr.id]="embedded ? null : 'apps'"
    [attr.aria-labelledby]="embedded ? 'vault-heading' : 'tab-apps'"
    tabindex="0"
  >
    @for (data of cards; track data) {
      <app-card [card_data]=data></app-card>
    }
  </div>
}

@if (error) {
  <div class="error">{{error}}</div>
}

@if (showSpinner) {
  <app-loader></app-loader>
}
