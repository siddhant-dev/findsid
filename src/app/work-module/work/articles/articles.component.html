@if (!showSpinner) {
  <div class="grid-container" aria-labelledby="tab-article" id="articles" tabindex="0">
    @for (article of articles; track article) {
      <app-card [card_data]=article></app-card>
    }
  </div>
}

@if (showSpinner) {
  <app-loader></app-loader>
}

@if (error) {
  <div class="error">{{error}}</div>
}
