@if (!showSpinner) {
  @if (articles.length === 0 && !error) {
    <p class="empty-state">No articles are available right now.</p>
  }
  <div
    class="grid-container"
    [attr.aria-labelledby]="embedded ? 'articles-heading' : 'tab-article'"
    [attr.id]="embedded ? null : 'articles'"
    tabindex="0"
  >
    @for (article of articles; track article) {
      <app-card [card_data]=article></app-card>
    }
  </div>
}

@if (showSpinner) {
  <app-loader></app-loader>
}

@if (error) {
  <div class="error">{{error}}</div>
}
