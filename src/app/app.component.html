<header>
    <a role="button" href="javascript:void(0);" (click)="skipContent()" translate class="skip-nav">Skip to Content</a>
    <nav role="navigation">
        <h6 role="link" tabindex="0" routerLink="/" class="bold blue">Siddhant Jaiswal<sup class="overline">βeta</sup>
        </h6>
        <div class="burger" role="button" tabindex="0" (click)="toggleNavbar()" (keyup.enter)="toggleNavbar()"
            aria-controls="nav-menu" [attr.aria-expanded]="navbarOpen" title="Menu Button">
            <i-feather [name]=menuIcon></i-feather>
        </div>
        <ul [ngClass]="{'open' : navbarOpen}" role="menubar" id="nav-menu">
            <li role=none>
                <a role="menuitem" tabindex="0" aria-posinset="1" aria-setsize="5" class="regular bold" routerLink="/"
                    routerLinkActive="active extra-bold" [routerLinkActiveOptions]={exact:true}
                    (click)="toggleNavbar()">
                    About
                </a>
            </li>
            <li role=none>
                <a role="menuitem" aria-posinset="2" aria-setsize="5" tabindex="0" class="regular bold"
                    routerLink="/work" routerLinkActive="active extra-bold" (click)="toggleNavbar()">
                    Work
                </a>
            </li>
            <li role=none>
                <a role="menuitem" aria-posinset="4" aria-setsize="5" tabindex="0" class="regular bold"
                    routerLink="/resume" routerLinkActive="active extra-bold" (click)="toggleNavbar()">
                    Resume
                </a>
            </li>
            <li role=none>
                <a role="menuitem" aria-posinset="5" aria-setsize="5" tabindex="0" class="regular bold"
                    routerLink="/contact" routerLinkActive="active extra-bold" (click)="toggleNavbar()">
                    Contact
                </a>
            </li>
            <li role="none">
                <label role="menuitem" aria-posinset="6" tabindex="0" class="toggle">
                    <span>Light</span>
                    <input type="checkbox" class="switch" [(ngModel)]="theme" #ctrl="ngModel"
                        (change)="onThemeChange()">
                    <span>Dark</span>
                </label>
            </li>
        </ul>
    </nav>
</header>
<main id="main" #skipper tabindex="-1">
    <router-outlet></router-outlet>
</main>

<footer>
    <a href="https://www.linkedin.com/in/iamsiddj" rel="noreferrer" target="_blank" aria-label="LinkedIn">
        <i-feather name="linkedin"></i-feather>
    </a><a href="https://www.instagram.com/isuckatdesign/" rel="noreferrer" target="_blank" aria-label="Instagram">
        <i-feather name="instagram"></i-feather>
    </a><a href="https://twitter.com/iamsidd_j" rel="noreferrer" target="_blank" aria-label="Twitter">
        <i-feather name="twitter"></i-feather>
    </a><a href="https://github.com/siddhant-dev" rel="noreferrer" target="_blank" aria-label="Github">
        <i-feather name="github"></i-feather>
    </a><a href="https://codepen.io/sidd_dev" rel="noreferrer" target="_blank" aria-label="Code Pen">
        <i-feather name="codepen"></i-feather>
    </a>
</footer>
