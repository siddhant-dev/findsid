<div class="blueprint-bg" aria-hidden="true"></div>
<header>
    <a role="button" href="javascript:void(0);" (click)="skipContent()" translate class="skip-nav">Skip to Content</a>
    <nav role="navigation">
        <h6 role="link" tabindex="0" routerLink="/" class="content-title accent-text">Siddhant Jaiswal<sup class="metadata-text">βeta</sup>
        </h6>
        <div class="burger" role="button" tabindex="0" (click)="toggleNavbar()" (keyup.enter)="toggleNavbar()"
            aria-controls="nav-menu" [attr.aria-expanded]="navbarOpen" title="Menu Button">
            <i-feather [name]=menuIcon></i-feather>
        </div>
        <ul [ngClass]="{'open' : navbarOpen}" role="menubar" id="nav-menu">
            <li role=none>
                <a role="menuitem" tabindex="0" aria-posinset="1" aria-setsize="4" class="navigation-text" routerLink="/"
                    routerLinkActive="active" [routerLinkActiveOptions]={exact:true}
                    (click)="toggleNavbar()">
                    About
                </a>
            </li>
            <li role=none>
                <a role="menuitem" aria-posinset="2" aria-setsize="4" tabindex="0" class="navigation-text"
                    routerLink="/work" routerLinkActive="active" (click)="toggleNavbar()">
                    Work
                </a>
            </li>
            <li role=none>
                <a role="menuitem" aria-posinset="3" aria-setsize="4" tabindex="0" class="navigation-text"
                    routerLink="/resume" routerLinkActive="active" (click)="toggleNavbar()">
                    Resume
                </a>
            </li>
            <li role=none>
                <a role="menuitem" aria-posinset="4" aria-setsize="4" tabindex="0" class="navigation-text"
                    routerLink="/contact" routerLinkActive="active" (click)="toggleNavbar()">
                    Contact
                </a>
            </li>
        </ul>
    </nav>
</header>
<main id="main" #skipper tabindex="-1">
    <router-outlet></router-outlet>
</main>

<footer>
    <a href="https://www.linkedin.com/in/iamsiddj" rel="noreferrer" target="_blank" aria-label="LinkedIn">
        <i-feather name="linkedin"></i-feather>
    </a><a href="https://twitter.com/iamsidd_j" rel="noreferrer" target="_blank" aria-label="Twitter">
        <i-feather name="twitter"></i-feather>
    </a><a href="https://github.com/siddhant-dev" rel="noreferrer" target="_blank" aria-label="Github">
        <i-feather name="github"></i-feather>
    </a><a href="https://codepen.io/sidd_dev" rel="noreferrer" target="_blank" aria-label="Code Pen">
        <i-feather name="codepen"></i-feather>
    </a>
</footer>
