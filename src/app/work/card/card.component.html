<div class="card">
    <div class="banner" >
        <img [src]="imgUrl" alt="ada" height="185" width="345">
    </div>
    <div class="card-body">
        <section class="header">
            <h6 tabindex="0">Light Speed CSS</h6>
            <span class="tag">#css</span>
        </section>
        <p class="description" tabindex="0">
            Light Speed CSS is a CSS framework that is designed to be fast and lightweight.
        </p>
        <section class="footer">
            <a routerLink="" tabindex="0">Open</a>
            <div class="pub" tabindex="0">
                <span class="regular bold">Published On</span>
                <span class="sub-2">May 1, 2019</span>
            </div>
        </section>
    </div>
</div>
